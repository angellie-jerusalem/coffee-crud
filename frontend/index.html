<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewBase — Coffee Menu Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">☕</div>
    <div>
      <div class="brand-name">BrewBase</div>
      <div class="brand-sub">Menu Manager</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">Total Items</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="availCount">0</div>
      <div class="stat-label">Available</div>
    </div>
  </div>
</header>

<div class="container">
  <div class="layout">

    <!-- FORM PANEL -->
    <div class="panel">
      <div class="panel-title" id="formTitle">Add New Item</div>

      <input type="hidden" id="itemId" />

      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Caramel Latte" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="itemCategory">
          <option value="">Select category</option>
          <option value="Coffee">Coffee</option>
          <option value="Non-Coffee">Non-Coffee</option>
          <option value="Frappe">Frappe</option>
          <option value="Pastry">Pastry</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (₱)</label>
        <input type="number" id="itemPrice" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="itemDesc" placeholder="Short description..."></textarea>
      </div>
      <div class="form-group">
        <div class="toggle-row">
          <span class="toggle-label">Available</span>
          <button class="toggle on" id="toggleAvail" onclick="toggleAvailable()"></button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="resetForm()">Clear</button>
        <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">Add Item</button>
      </div>
    </div>

    <!-- MENU GRID -->
    <div>
      <div class="grid-header">
        <div class="grid-title">Menu Items</div>
      </div>
      <div class="filter-tabs" id="filterTabs">
        <div class="tab active" onclick="filterBy('All')">All</div>
        <div class="tab" onclick="filterBy('Coffee')">Coffee</div>
        <div class="tab" onclick="filterBy('Non-Coffee')">Non-Coffee</div>
        <div class="tab" onclick="filterBy('Frappe')">Frappe</div>
        <div class="tab" onclick="filterBy('Pastry')">Pastry</div>
      </div>
      <br/>
      <div class="cards" id="menuCards">
        <div class="empty">
          <div class="empty-icon">☕</div>
          <p>Loading menu...</p>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
